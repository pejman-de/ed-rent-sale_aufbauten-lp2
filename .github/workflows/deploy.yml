name: Deploy to Cloudflare Pages

# Seit dem 30.09.2026 laufen die Landingpages ueber Cloudflare Pages statt
# GitHub Pages (Auftragsverarbeitungsvertrag mit Cloudflare vorhanden, mit
# GitHub nicht). Benoetigt die Repository-Secrets CLOUDFLARE_API_TOKEN
# (Berechtigung "Cloudflare Pages: Edit") und CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Die CNAME-Datei braucht nur GitHub Pages.
      - run: rm -f dist/public/CNAME
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=ed-rent-aufbau --branch=main --commit-dirty=true
